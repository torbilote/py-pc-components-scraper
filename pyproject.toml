[project]
name = "py-pc-components-scraper"
version = "0.2.0"
description = "Local CLI scraper that collects PC component prices and specs from x-kom.pl into local CSV files."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "loguru>=0.7.3",
    "ai-cloudscraper>=3.8.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
pc-scraper = "pc_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pc_scraper"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
    "types-requests>=2.33.0.20260712",
]

[tool.mypy]
strict = true
exclude = [".venv"]

[[tool.mypy.overrides]]
module = "cloudscraper.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.format]
quote-style = "double"
